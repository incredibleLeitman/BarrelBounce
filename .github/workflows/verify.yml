name: Verify online runs

# Replays pending leaderboard runs and published levels with the game's own simulation
# (headless Godot) and marks them verified or rejected on the server.
# Needs two repository secrets: API_URL (https://.../api.php) and ADMIN_KEY (as in config.php).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Skip when the API is not configured
        id: cfg
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$ADMIN_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "API_URL / ADMIN_KEY secrets are not set; nothing to do."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pending rows
        if: steps.cfg.outputs.configured == 'true'
        id: fetch
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -e
          # Follow redirects and show where the request ended up, so a moved API is obvious in the log.
          STATUS=$(curl -sS -L -G "$API_URL" --data-urlencode "action=pending" --data-urlencode "key=$ADMIN_KEY" \
                   -o pending.json -w "%{http_code} %{url_effective}")
          echo "API answered: HTTP ${STATUS%% *} at ${STATUS#* }" | sed "s#key=[^& ]*#key=***#"
          if ! python3 -c "import json;d=json.load(open('pending.json'));assert d.get('ok')" 2>/dev/null; then
            echo "::error::The API did not return ok JSON. First bytes of the answer:"
            head -c 300 pending.json; echo
            exit 1
          fi
          COUNT=$(python3 -c "import json;d=json.load(open('pending.json'));print(len(d.get('runs',[]))+len(d.get('levels',[])))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$COUNT pending row(s)"

      - name: Check the public API
        if: steps.cfg.outputs.configured == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -e
          # The same call the Community tab makes; prints how many levels are listed.
          curl -sS -L -G "$API_URL" --data-urlencode "action=levels" --data-urlencode "player_id=ci" -o levels.json
          python3 -c "import json;d=json.load(open('levels.json'));assert d.get('ok'),d;print(len(d['rows']),'community level(s) listed');[print(' -',r['name'],r['status'],'stars',r['stars']) for r in d['rows']]"
          # And each level's leaderboard, as the win panel shows it (names only, no ids).
          for pair in $(python3 -c "import json;[print(r['id']+':'+r['rev']) for r in json.load(open('levels.json'))['rows']]"); do
            curl -sS -L -G "$API_URL" --data-urlencode "action=leaderboard" --data-urlencode "level_id=${pair%%:*}" --data-urlencode "rev=${pair##*:}" -o board.json
            python3 -c "import json;d=json.load(open('board.json'));assert d.get('ok'),d;print('   leaderboard of',repr('${pair%%:*}'),':',d['total'],'verified run(s)');[print('    ',r['rank'],r['player_name'],'%.2f s'%(r['ticks']/60)) for r in d['rows']]"
          done

      - name: List every run (admin)
        if: steps.cfg.outputs.configured == 'true'
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -e
          curl -sS -L -G "$API_URL" --data-urlencode "action=all_runs" --data-urlencode "key=$ADMIN_KEY" -o runs.json
          python3 -c "
          import json
          d = json.load(open('runs.json'))
          if not d.get('ok'):
              print('all_runs not available:', d.get('error'))
          else:
              print(len(d['rows']), 'run(s) on the server, newest first')
              for r in d['rows']:
                  print('  %-24s %-16s %6.2f s  %-9s %s  %s' % (r['level_name'][:24], r['player_name'][:16], r['ticks'] / 60, r['status'], r['reason'], r['created_at']))
          "

      - name: Cache Godot
        if: steps.cfg.outputs.configured == 'true' && steps.fetch.outputs.count != '0'
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-bin

      - name: Download Godot
        if: steps.cfg.outputs.configured == 'true' && steps.fetch.outputs.count != '0' && steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o -q godot.zip && rm godot.zip

      - name: Replay with the game's simulation
        if: steps.cfg.outputs.configured == 'true' && steps.fetch.outputs.count != '0'
        run: |
          set -e
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          # The import builds the class cache the scripts need; without it they fail to parse
          # and headless Godot would sit idle forever, so check it and bound both commands.
          timeout 300 $GODOT --headless --import || echo "import exited with $?"
          test -f .godot/global_script_class_cache.cfg || { echo "::error::Project import failed."; exit 1; }
          timeout 600 $GODOT --headless -s tools/verify_runs.gd -- pending.json results.json
          test -f results.json

      - name: Report verdicts
        if: steps.cfg.outputs.configured == 'true' && steps.fetch.outputs.count != '0'
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -e
          python3 - <<'EOF'
          import json, os
          r = json.load(open('results.json'))
          r['key'] = os.environ['ADMIN_KEY']
          json.dump(r, open('resolve.json', 'w'))
          EOF
          SEP='?'; case "$API_URL" in *\?*) SEP='&';; esac
          # Follow redirects while keeping the POST (a secret with http:// or www. would
          # otherwise silently lose the verdicts), and insist on an ok answer.
          curl -sS --fail -L --post301 --post302 --post303 -X POST "${API_URL}${SEP}action=resolve" \
               -H "Content-Type: application/json" --data-binary @resolve.json -o resolve_answer.json \
               -w "HTTP %{http_code} at %{url_effective}\n" | sed "s#key=[^& ]*#key=***#"
          cat resolve_answer.json; echo
          python3 -c "import json;d=json.load(open('resolve_answer.json'));assert d.get('ok'),d"
